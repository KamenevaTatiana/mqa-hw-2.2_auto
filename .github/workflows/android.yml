name: Android CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Remove local JDK path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (assemble)
        run: ./gradlew assemble

  test:
    runs-on: ubuntu-latest  # теперь Ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Remove local JDK path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (hardware acceleration)
        run: |
          sudo chown root:kvm /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64              # x86_64 на Ubuntu работает
          profile: pixel_4
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew connectedCheck
